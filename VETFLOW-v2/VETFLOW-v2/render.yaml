# Atajo opcional para Render ("Blueprint"). Si lo usás, Render carga esta configuración
# y solo te pide los valores marcados como secretos.
services:
  - type: web
    name: veterinaria
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Adjuntos de estudios (Supabase Storage). Opcionales: sin ellas el sistema funciona, pero sin adjuntos.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: estudios
      - key: CLINIC_NAME
        sync: false
      # Opcional: informe semanal por email (resend o brevo). Sin estas, el informe queda desactivado.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
