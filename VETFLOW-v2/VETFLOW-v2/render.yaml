# Atajo opcional para Render ("Blueprint"). Si lo usás, Render carga esta configuración
# y solo te pide los valores marcados como secretos.
services:
  - type: web
    name: veterinaria
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Adjuntos de estudios (Supabase Storage). Opcionales: sin ellas el sistema funciona, pero sin adjuntos.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: estudios
      - key: CLINIC_NAME
        sync: false
      # Chatbot de WhatsApp (ver WHATSAPP.md). Opcionales: sin ellas el bot queda apagado.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_LOG_KEY
        sync: false
