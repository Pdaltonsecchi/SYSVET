<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SYSVET</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cg%20fill%3D%22%2356785B%22%3E%3Cellipse%20cx%3D%226.2%22%20cy%3D%2210.4%22%20rx%3D%222%22%20ry%3D%222.6%22%2F%3E%3Cellipse%20cx%3D%229.6%22%20cy%3D%225.8%22%20rx%3D%222%22%20ry%3D%222.7%22%2F%3E%3Cellipse%20cx%3D%2214.4%22%20cy%3D%225.8%22%20rx%3D%222%22%20ry%3D%222.7%22%2F%3E%3Cellipse%20cx%3D%2217.8%22%20cy%3D%2210.4%22%20rx%3D%222%22%20ry%3D%222.6%22%2F%3E%3Cpath%20d%3D%22M12%2011.4c-2.6%200-5.4%203.6-5.4%206%200%201.6%201.2%202.4%202.6%202.4%201.1%200%201.8-.6%202.8-.6s1.7.6%202.8.6c1.4%200%202.6-.8%202.6-2.4%200-2.4-2.8-6-5.4-6z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-state="loading">

<div id="boot" class="boot" role="status">
  <div class="boot-mark" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="currentColor"><ellipse cx="6.2" cy="10.4" rx="2" ry="2.6"/><ellipse cx="9.6" cy="5.8" rx="2" ry="2.7"/><ellipse cx="14.4" cy="5.8" rx="2" ry="2.7"/><ellipse cx="17.8" cy="10.4" rx="2" ry="2.6"/><path d="M12 11.4c-2.6 0-5.4 3.6-5.4 6 0 1.6 1.2 2.4 2.6 2.4 1.1 0 1.8-.6 2.8-.6s1.7.6 2.8.6c1.4 0 2.6-.8 2.6-2.4 0-2.4-2.8-6-5.4-6z"/></g></svg></div>
  <p id="boot-msg">Iniciando el sistema…</p>
  <small id="boot-sub">La primera vez del día puede tardar hasta un minuto.</small>
  <button id="boot-retry" class="btn primary" type="button" hidden>Reintentar</button>
</div>

<div id="login" class="login">
  <form id="loginform" class="loginbox" autocomplete="on">
    <div class="brand2"><span aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="currentColor"><ellipse cx="6.2" cy="10.4" rx="2" ry="2.6"/><ellipse cx="9.6" cy="5.8" rx="2" ry="2.7"/><ellipse cx="14.4" cy="5.8" rx="2" ry="2.7"/><ellipse cx="17.8" cy="10.4" rx="2" ry="2.6"/><path d="M12 11.4c-2.6 0-5.4 3.6-5.4 6 0 1.6 1.2 2.4 2.6 2.4 1.1 0 1.8-.6 2.8-.6s1.7.6 2.8.6c1.4 0 2.6-.8 2.6-2.4 0-2.4-2.8-6-5.4-6z"/></g></svg></span> SYSVET</div>
    <h1>Ingresar</h1>
    <label class="fld"><span>Email</span><input id="lemail" name="email" type="email" autocomplete="username" required></label>
    <label class="fld"><span>Contraseña</span><input id="lpass" name="password" type="password" autocomplete="current-password" required></label>
    <p id="lerror" class="err" role="alert"></p>
    <button id="lbtn" class="btn primary" type="submit">Entrar</button>
  </form>
</div>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><span class="mark" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="currentColor"><ellipse cx="6.2" cy="10.4" rx="2" ry="2.6"/><ellipse cx="9.6" cy="5.8" rx="2" ry="2.7"/><ellipse cx="14.4" cy="5.8" rx="2" ry="2.7"/><ellipse cx="17.8" cy="10.4" rx="2" ry="2.6"/><path d="M12 11.4c-2.6 0-5.4 3.6-5.4 6 0 1.6 1.2 2.4 2.6 2.4 1.1 0 1.8-.6 2.8-.6s1.7.6 2.8.6c1.4 0 2.6-.8 2.6-2.4 0-2.4-2.8-6-5.4-6z"/></g></svg></span><div><b id="shopname">SYSVET</b><small>Sistema veterinario</small></div></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="alerts" id="alerts"></div>
    <nav class="nav nav-cfg" id="navcfg" aria-label="Configuración" hidden></nav>
    <div class="side-foot" id="userbox"></div>
  </aside>
  <main id="main"></main>
  <!-- Celular: accesos principales al alcance del pulgar; "Más" abre el menú lateral como hoja inferior -->
  <nav class="tabbar" id="tabbar" aria-label="Secciones principales"></nav>
  <div class="scrim" data-action="more" aria-hidden="true"></div>
</div>

<dialog id="dlg"></dialog>
<div id="print" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
